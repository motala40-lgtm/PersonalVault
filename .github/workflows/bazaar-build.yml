name: Bayganikade CI

on:
  push:
    branches: ["bazaar-edition"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayganikade-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Bayganikade's OWN separate keystore — never Easy Archive's. These secrets
      # (BAYGANIKADE_*) are distinct repo secrets from the ones android-build.yml uses, set up
      # the same way (see the main README's "Release signing setup" section) but under their
      # own names so the two products' signing material can never get mixed up.
      #
      # app/build.gradle.kts (shared by both branches) reads the plain KEYSTORE_PATH /
      # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD env var names regardless of which product
      # is building — here we just feed it from the BAYGANIKADE_* secrets instead of the
      # Easy Archive ones android-build.yml uses.
      - name: Decode release keystore
        if: ${{ env.BAYGANIKADE_KEYSTORE_BASE64 != '' }}
        env:
          BAYGANIKADE_KEYSTORE_BASE64: ${{ secrets.BAYGANIKADE_KEYSTORE_BASE64 }}
        run: echo "$BAYGANIKADE_KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build signed release AAB
        if: ${{ env.BAYGANIKADE_KEYSTORE_BASE64 != '' }}
        env:
          BAYGANIKADE_KEYSTORE_BASE64: ${{ secrets.BAYGANIKADE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.BAYGANIKADE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAYGANIKADE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAYGANIKADE_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Upload release AAB artifact
        if: ${{ env.BAYGANIKADE_KEYSTORE_BASE64 != '' }}
        env:
          BAYGANIKADE_KEYSTORE_BASE64: ${{ secrets.BAYGANIKADE_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: bayganikade-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
