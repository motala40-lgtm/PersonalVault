name: Bayganikade CI

on:
  push:
    branches: ["bazaar-edition"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayganikade-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # No release-signing step yet: Bayganikade needs its OWN separate keystore (never the
      # Easy Archive one — a different product for a different store) before a signed release
      # build makes sense. Add that back here once that keystore exists and its secrets are
      # configured, following the same pattern as android-build.yml.
